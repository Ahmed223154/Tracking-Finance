name: Build & Package iOS .ipa

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean and Install Dependencies (Native Darwin)
        run: |
          rm -rf node_modules package-lock.json
          npm install --force

      - name: Build Web App
        run: npm run build

      - name: Sync iOS Project
        run: npx cap sync ios

      - name: CocoaPods Install & Disable Pod Signing
        working-directory: ios/App
        run: |
          pod install --repo-update
          # Disable code signing on all pod targets
          sed -i '' -e 's/EXPANDED_CODE_SIGN_IDENTITY = ""/EXPANDED_CODE_SIGN_IDENTITY = ""\nCODE_SIGNING_ALLOWED = "NO"/g' Pods/Pods.xcodeproj/project.pbxproj || true
          # Neutralize framework codesign invocations in CocoaPods embedding script
          if [ -f "Pods/Target Support Files/Pods-App/Pods-App-frameworks.sh" ]; then
            sed -i '' -e 's/code_sign "${source}"/# code_sign "${source}"/g' "Pods/Target Support Files/Pods-App/Pods-App-frameworks.sh" || true
          fi

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Build Xcode Archive (.xcarchive)
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO

      - name: Package Payload into Sideloadly-Ready .ipa
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-IPA
          path: App.ipa
          retention-days: 5
