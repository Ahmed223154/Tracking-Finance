name: Build & Package iOS .ipa

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean and Install Dependencies (Native Darwin)
        run: |
          rm -rf node_modules package-lock.json
          npm install --force

      - name: Build Web App
        run: npm run build

      - name: Sync iOS Project
        run: |
          npx cap sync ios
          # Ensure FinanceWidget target and Embed phase are configured in Xcode project
          python3 scripts/setup-widget-target.py

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
          echo "=== Available Schemes ==="
          xcodebuild -list -project ios/App/App.xcodeproj

      - name: Build App and Embedded Widget Extension
        run: |
          # Build the workspace/project using xcodebuild so Xcode links the iOS SDK properly
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Package Payload into Sideloadly-Ready .ipa
        run: |
          mkdir -p Payload
          cp -r derived_data/Build/Products/Release-iphoneos/App.app Payload/
          
          # Verify the native extension was built and embedded by Xcode
          if [ -d "derived_data/Build/Products/Release-iphoneos/FinanceWidget.appex" ] && [ ! -d "Payload/App.app/PlugIns/FinanceWidget.appex" ]; then
            mkdir -p Payload/App.app/PlugIns
            cp -r derived_data/Build/Products/Release-iphoneos/FinanceWidget.appex Payload/App.app/PlugIns/
          fi

          # Ad-hoc codesign the extension bundle for on-device resigning tools (SideStore / AltStore)
          if [ -d "Payload/App.app/PlugIns/FinanceWidget.appex" ]; then
            codesign --force --sign - "Payload/App.app/PlugIns/FinanceWidget.appex"
          fi
          
          echo "=== PlugIns Contents ==="
          ls -la Payload/App.app/PlugIns/ || echo "PlugIns folder not found!"
          
          echo "=== Verifying Mach-O Architecture ==="
          file Payload/App.app/PlugIns/FinanceWidget.appex/FinanceWidget
          
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Sideloadly
          path: App.ipa
          retention-days: 5
