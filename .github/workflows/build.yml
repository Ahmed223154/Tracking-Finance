name: Build & Package iOS .ipa

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean and Install Dependencies (Native Darwin)
        run: |
          rm -rf node_modules package-lock.json
          npm install --force

      - name: Build Web App
        run: npm run build

      - name: Sync iOS Project
        run: npx cap sync ios

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Build Xcode App and Widget Extension
        run: |
          # 1. Build the Widget Extension target if scheme exists
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme FinanceWidget \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" || true

          # 2. Build the Main App target
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Compile and Embed Native WidgetKit Extension (.appex)
        run: |
          APP_BUNDLE="derived_data/Build/Products/Release-iphoneos/App.app"
          PRODUCTS_EXT="derived_data/Build/Products/Release-iphoneos/FinanceWidget.appex"
          PLUGINS_DIR="$APP_BUNDLE/PlugIns/FinanceWidget.appex"
          mkdir -p "$PLUGINS_DIR"
          mkdir -p "$PRODUCTS_EXT"

          # 1. Copy Extension Info.plist
          cp ios/App/FinanceWidget/Info.plist "$PLUGINS_DIR/Info.plist"
          cp ios/App/FinanceWidget/Info.plist "$PRODUCTS_EXT/Info.plist"

          # 2. Compile Swift WidgetKit Extension for iOS arm64
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Compiling WidgetKit extension with SDK at: $SDK_PATH"

          swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -F "$SDK_PATH/System/Library/Frameworks" \
            -framework WidgetKit \
            -framework SwiftUI \
            -framework Foundation \
            -framework UIKit \
            -emit-executable \
            -parse-as-library \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -Xlinker -rpath -Xlinker @executable_path/../../Frameworks \
            ios/App/FinanceWidget/FinanceWidget.swift \
            -o "$PLUGINS_DIR/FinanceWidget"

          cp "$PLUGINS_DIR/FinanceWidget" "$PRODUCTS_EXT/FinanceWidget"

          # 3. Ad-hoc codesign the extension bundle for on-device resigning tools (SideStore / AltStore)
          codesign --force --sign - "$PLUGINS_DIR"
          codesign --force --sign - "$PRODUCTS_EXT"

          echo "Listing FinanceWidget.appex contents in Products:"
          ls -la "$PRODUCTS_EXT"
          echo "Listing FinanceWidget.appex contents in App.app/PlugIns:"
          ls -la "$PLUGINS_DIR"

      - name: Package Payload into Sideloadly-Ready .ipa
        run: |
          mkdir -p Payload
          cp -r derived_data/Build/Products/Release-iphoneos/App.app Payload/
          
          # Ensure PlugIns directory exists inside the App bundle
          mkdir -p Payload/App.app/PlugIns
          
          # Copy the compiled Widget Extension if it was output to Products
          if [ -d "derived_data/Build/Products/Release-iphoneos/FinanceWidget.appex" ]; then
            echo "Found FinanceWidget.appex in Products, embedding into PlugIns..."
            cp -r derived_data/Build/Products/Release-iphoneos/FinanceWidget.appex Payload/App.app/PlugIns/
          elif [ -d "derived_data/Build/Products/Release-iphoneos/App.app/PlugIns/FinanceWidget.appex" ]; then
            echo "Found FinanceWidget.appex inside App.app/PlugIns, copying to Payload..."
            cp -r derived_data/Build/Products/Release-iphoneos/App.app/PlugIns/FinanceWidget.appex Payload/App.app/PlugIns/
          else
            echo "Looking for .appex files in derived_data..."
            find derived_data -name "*.appex" -exec cp -r {} Payload/App.app/PlugIns/ \;
          fi

          # Apply ad-hoc codesign to extension in Payload
          if [ -d "Payload/App.app/PlugIns/FinanceWidget.appex" ]; then
            codesign --force --sign - "Payload/App.app/PlugIns/FinanceWidget.appex"
          fi

          # Log contents of PlugIns to verify presence in the GitHub log
          echo "=== PlugIns Contents ==="
          ls -la Payload/App.app/PlugIns/
          ls -la Payload/App.app/PlugIns/FinanceWidget.appex
          
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Sideloadly
          path: App.ipa
          retention-days: 5
