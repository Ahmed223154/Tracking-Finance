name: Build & Package iOS .ipa

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --os=darwin --cpu=arm64 || npm install --os=darwin --cpu=arm64
          npm rebuild lightningcss @rollup/rollup-darwin-arm64 || true

      - name: Build Web App
        run: npm run build

      - name: Sync iOS Project
        run: npx cap sync ios

      - name: CocoaPods Install
        working-directory: ios/App
        run: pod install --repo-update

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Build Xcode Archive (.xcarchive)
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into Sideloadly-Ready .ipa
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r FinanceApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceApp-IPA
          path: FinanceApp.ipa
          retention-days: 5
